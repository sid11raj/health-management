# Database — configure via environment variables, never commit real credentials.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/health_records?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
# db/schema.sql is reference/migration documentation only. It must NOT be
# auto-executed against MySQL; schema changes go through reviewed migrations.
spring.sql.init.mode=never
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Server
server.port=${PORT:8080}

# JWT — JWT_SECRET must be a Base64-encoded key of at least 256 bits.
# Generate one with: openssl rand -base64 32
# Access tokens are SHORT-lived (15 min by default). Long sessions come
# from refresh-token rotation (/api/auth/refresh), not from long access tokens.
app.jwt.secret=${JWT_SECRET:}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:900000}

# Refresh tokens — raw values are never stored (only SHA-256 hashes).
app.refresh-token.expiration-ms=${REFRESH_TOKEN_EXPIRATION_MS:604800000}

# Field-level encryption (AES-GCM) for diagnosis, treatment, prescription
# instructions and TOTP secrets. ENCRYPTION_KEY must be Base64, 32 bytes:
#   openssl rand -base64 32
# WARNING: losing this key makes encrypted fields unreadable. Back it up
# securely (secret manager), never commit it. If unset, fields are stored
# as plaintext (dev only) and a startup warning is logged.
app.encryption.key=${ENCRYPTION_KEY:}

# Account lockout after failed logins.
app.lockout.max-attempts=${LOCKOUT_MAX_ATTEMPTS:5}
app.lockout.duration-minutes=${LOCKOUT_DURATION_MINUTES:15}

# File uploads — also enforced in code by FileUploadValidator.
app.upload.dir=${UPLOAD_DIR:uploads}
app.upload.max-file-size-bytes=${UPLOAD_MAX_BYTES:10485760}
app.upload.allowed-content-types=${UPLOAD_ALLOWED_TYPES:application/pdf,image/png,image/jpeg,text/plain}
app.upload.allowed-extensions=${UPLOAD_ALLOWED_EXTENSIONS:pdf,png,jpg,jpeg,txt}
spring.servlet.multipart.max-file-size=${MAX_FILE_SIZE:10MB}
spring.servlet.multipart.max-request-size=${MAX_REQUEST_SIZE:10MB}

# Rate limiting (in-memory, single-instance only — see RateLimitFilter).
# Strict bucket for /api/auth/**, looser bucket for sensitive writes and
# audit-log reads, both per client IP.
app.rate-limit.auth.max-requests-per-minute=${AUTH_RATE_LIMIT_PER_MINUTE:30}
app.rate-limit.sensitive.max-requests-per-minute=${SENSITIVE_RATE_LIMIT_PER_MINUTE:120}

# Observability — only health/info are exposed over HTTP by default.
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
info.app.name=Health Records Management System
info.app.version=1.0.0

# Mail — all values come from the environment. If mail is not configured,
# EmailService logs the failure and does not block record/prescription creation.
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=false

# CORS is configured in SecurityConfig; the frontend origin is set here.
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173}
