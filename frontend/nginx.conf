server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Security headers for the served SPA. CSP is strict here (no
    # 'unsafe-inline' for scripts): the app is a Vite build with no inline
    # scripts, so this holds. If an inline script is ever added, this CSP
    # must be revisited, not silently loosened.
    # HSTS is deliberately NOT set here: this container serves plain HTTP
    # in Docker/dev, and HSTS over HTTP is ignored by browsers. Terminate
    # TLS at a reverse proxy/load balancer in production and set HSTS there.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Single-page app fallback: unknown paths serve index.html so
    # React Router routes (/login, /records, ...) work on refresh.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API proxy: the frontend calls /api/... and nginx forwards it to
    # the backend service, preserving the /api prefix.
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
